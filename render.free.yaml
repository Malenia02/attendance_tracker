services:
  - type: web
    name: malenia02-attendance-api-test
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deployment/render/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: APP_NAME
        value: DILG GIP Attendance Tracker (Test)
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://malenia02-attendance-api-test.onrender.com
      - key: FRONTEND_DEPLOYMENT
        value: external
      - key: FRONTEND_API_PROXY
        value: "true"
      - key: FRONTEND_URL
        sync: false
      - key: TRUSTED_HOSTS
        value: ^(malenia02-attendance-api-test\.onrender\.com|attendance-tracker-rho-one\.vercel\.app)$
      - key: TRUSTED_PROXIES
        value: "*"
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        value: /tmp/dilg-mysql-ca.pem
      - key: MYSQL_SSL_CA_BASE64
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_HTTP_ONLY
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: SESSION_COOKIE
        value: dilg_attendance_test_session
      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CACHE_STORE
        value: database
      - key: CACHE_PREFIX
        value: dilg_attendance_test_
      - key: QUEUE_CONNECTION
        value: sync
      - key: DASHBOARD_CACHE_SECONDS
        value: "30"
      - key: DTR_SYNC_BATCH_LIMIT
        value: "20"
      - key: FILESYSTEM_DISK
        value: local
      - key: DTR_SIGNING_KEY
        generateValue: true
      - key: QR_SIGNING_KEY
        generateValue: true
      - key: MAXIMUM_LOCATION_ACCURACY_METERS
        value: "100"
      - key: MAIL_MAILER
        value: log
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: EPHEMERAL_UPLOADS
        value: "true"
